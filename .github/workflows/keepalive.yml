name: Keep Supabase awake

# Free Supabase projects pause after ~7 days without activity.
on:
  schedule:
    - cron: '0 12 */3 * *' # every 3 days at 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/" -H "apikey: $KEY")
          echo "Supabase responded with HTTP $status"
          [ "$status" -lt 500 ]
